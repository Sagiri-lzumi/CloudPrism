<!DOCTYPE html>
<html lang="zh-CN"><script>if(location.search.includes('dark'))document.documentElement.dataset.theme='dark';</script><head><meta charset="utf-8"><title>CloudPrism</title>
<style>
:root{
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --bg:#f4f5f7; --surface:#ffffff; --hover:rgba(16,24,40,.05);
  --stroke:rgba(16,24,40,.08); --stroke-card:transparent;
  --text:#1c1c21; --text2:#5a5a63; --text3:#9a9aa3; --heading:#16161a;
  --glass:rgba(255,255,255,.62); --glass-card:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.72);
  --scrim:rgba(0,0,0,.5);
  --a1:rgba(0,122,255,.08); --a2:rgba(94,92,230,.07); --a3:rgba(52,199,89,.06);
}
html[data-theme="dark"]{
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.26);
  --bg:#1a1a1e; --surface:#232327; --hover:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.10); --stroke-card:rgba(255,255,255,.08);
  --text:#f2f2f5; --text2:#bfbfc8; --text3:#6e6e78; --heading:#f5f5f7;
  --glass:rgba(28,28,32,.62); --glass-card:rgba(38,38,44,.55); --glass-edge:rgba(255,255,255,.10);
  --a1:rgba(10,132,255,.17); --a2:rgba(100,98,235,.15); --a3:rgba(48,209,88,.12);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
body{
  background:
    radial-gradient(1100px 620px at 6% -8%, var(--a1), transparent 62%),
    radial-gradient(900px 520px at 106% 6%, var(--a2), transparent 62%),
    radial-gradient(1000px 420px at 50% 118%, var(--a3), transparent 62%),
    var(--bg);
  color:var(--text);height:100vh;overflow:hidden;font-size:14px}
.shell{display:flex;height:100vh}

/* ===== 侧栏 ===== */
.side{width:432px;flex-shrink:0;display:flex;flex-direction:column;padding:24px 20px 16px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);
  border-right:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:20px;padding:4px 12px 28px}
.brand img{width:60px;height:60px;border-radius:15px;
  box-shadow:0 3px 12px -1px color-mix(in srgb, var(--accent) 45%, transparent)}
.brand b{font-size:30px;font-weight:650;letter-spacing:.2px;color:var(--heading)}
.sec{font-size:20px;font-weight:600;color:var(--text3);letter-spacing:1.5px;padding:20px 18px 10px}
.nav{display:flex;align-items:center;gap:20px;height:76px;padding:0 22px;border-radius:14px;
  color:var(--text);font-size:26px;margin-bottom:3px}
.nav .ic{width:38px;font-size:34px;color:var(--text2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav.on .ic{color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:22px;font-weight:600;
  min-width:38px;height:38px;border-radius:99px;display:grid;place-items:center;padding:0 11px}
.tree .nav{height:68px;font-size:26px;color:var(--text2)}
.tree .nav .ic{font-size:30px}
.tree .nav.on{color:var(--accent)}
.quota{display:flex;align-items:center;gap:16px;margin:auto 2px 16px;padding:20px 20px;border-radius:16px;
  background:color-mix(in srgb, var(--text) 4%, transparent);border:1px solid var(--stroke);
  font-size:22px;color:var(--text2)}
.quota .ic{font-size:28px;color:var(--text3)}
.quota .bar{flex:1;height:8px;border-radius:3px;background:color-mix(in srgb, var(--text) 10%, transparent);overflow:hidden}
.quota .bar i{display:block;height:100%;width:42%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#5e5ce6)}
.foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--stroke);padding-top:16px}
.foot .nav{flex:1}
.iconbtn{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;color:var(--text2);font-size:34px}

/* ===== 主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
/* 单条顶栏（对齐真实应用） */
.topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);border-bottom:1px solid var(--stroke)}
.topbar .btn .ic{font-size:26px}
.iconbtn2{width:56px;padding:0;justify-content:center}
.sp{flex:1}
.sp{flex:1}
.btn{height:64px;padding:0 30px;border-radius:12px;display:flex;align-items:center;gap:14px;font-size:25px;
  background:var(--surface);border:1px solid var(--stroke);color:var(--text)}
.btn .ic{font-size:26px}
.btn.primary{position:relative;overflow:hidden;background:var(--accent);border-color:transparent;color:#fff;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 3px color-mix(in srgb, var(--accent) 35%, transparent)}
.btn.primary .ic{color:#fff}
.segv{display:flex;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:5px;gap:4px}
.segv span{width:56px;height:50px;border-radius:9px;display:grid;place-items:center;color:var(--text3);font-size:26px}
.segv span.on{background:color-mix(in srgb, var(--text) 8%, transparent);color:var(--text)}

/* ===== 网格 ===== */
.content{flex:1;padding:16px 40px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:24px}
.card{background:var(--glass-card);border:1px solid var(--stroke-card);border-radius:20px;overflow:hidden;
  box-shadow:inset 0 1px 0 var(--glass-edge)}
.card.hot{background:var(--accent-soft);border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent),inset 0 1px 0 var(--glass-edge)}
.thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;
  margin:0 12px 6px;border-radius:20px;overflow:hidden}
.thumb .ext{position:absolute;top:12px;right:12px;padding:3px 12px;font-size:18px;font-weight:700;
  letter-spacing:.5px;color:#fff;background:var(--scrim);border-radius:5px}
.thumb .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;
  background:var(--scrim);display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.thumb .play .ic{fill:#fff;stroke:none;margin-left:4px;font-size:30px}
.thumb .dur{position:absolute;right:12px;bottom:12px;padding:3px 10px;font-size:18px;color:#fff;
  background:var(--scrim);border-radius:99px;font-variant-numeric:tabular-nums}
.thumb .scene{position:absolute;inset:0;width:100%;height:100%}
.thumb.flat{background:color-mix(in srgb, var(--text) 5%, transparent)}
.thumb.flat .ic{font-size:64px;color:var(--text3)}
.thumb.flat .ic.acc{color:var(--accent)}
html:not([data-theme="dark"]) .thumb.flat{background:rgba(16,24,40,.07)}
.cap{padding:4px 20px 14px;text-align:center}
.nm{font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:5px;font-size:19px;color:var(--text3);font-variant-numeric:tabular-nums}
.hot .nm{color:var(--accent);font-weight:600}

/* ===== 传输条 + 状态栏 ===== */
.transfer{display:flex;align-items:center;gap:22px;padding:20px 40px;font-size:23px;color:var(--text2);
  background:var(--glass);backdrop-filter:blur(28px);border-top:1px solid var(--stroke)}
.transfer .ic{font-size:26px;color:var(--accent)}
.transfer .bar{flex:1;max-width:860px;height:10px;border-radius:3px;background:color-mix(in srgb, var(--text) 10%, transparent);overflow:hidden}
.transfer .bar i{display:block;height:100%;width:62%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),#5e5ce6)}
.transfer .pct{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.status{height:60px;display:flex;align-items:center;gap:30px;padding:0 40px;font-size:21px;color:var(--text3);
  background:var(--glass);backdrop-filter:blur(28px);border-top:1px solid var(--stroke)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#30d158;margin-right:6px;
  box-shadow:0 0 0 3px color-mix(in srgb, #30d158 18%, transparent)}
.status .r{margin-left:auto;display:flex;gap:18px}
</style></head>

  <aside class="side">
    <div class="brand"><img src="../Pic/icon.png" alt=""/><b>CloudPrism</b></div>

    <div class="tree">
      <div class="nav on"><svg class="ic"><use href="#i-chev"/></svg><svg class="ic" style="font-size:30px"><use href="#i-cloud"/></svg>我的密库</div>
    <div class="foot">
      <div class="nav"><svg class="ic"><use href="#i-lock"/></svg>锁定密库</div>
      <div class="iconbtn"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></div>
      <div class="iconbtn"><svg class="ic"><use href="#i-power"/></svg></div>
    </div>
  </aside>

  <section class="main">
    <!-- 单条顶栏（与真实应用一致）：左 = 主页；右 = 上传/新建/视图/搜索/更多 -->

      <button class="btn iconbtn2" title="主页"><svg class="ic"><use href="#i-home"/></svg></button>

<script>
// 按真实应用密度生成 8 列 × 4 行网格（实测真机 1440 窗口为 8 列 136px 卡）
const C = [
