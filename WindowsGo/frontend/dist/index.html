<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>CloudPrism</title>
    <link rel="icon" type="image/png" href="/brand.png"/>
    <script>
        // 首屏主题：HTML 解析完成前应用缓存主题，避免浅色闪白/深色闪黑。
        // 取值口径与 frontend/src/lib/theme.ts 镜像（KEY: cp-theme，
        // 合法值 light|dark|auto，其余回退浅色 —— 浅色无需写属性）。
        (function () {
            try {
                var t = localStorage.getItem('cp-theme');
                if (t === 'light' || t === 'dark' || t === 'auto') {
                    document.documentElement.dataset.theme = t;
                }
            } catch (e) { /* localStorage 不可用（隐私模式）时保持默认浅色 */ }
        })();
        // JS 错误兜底：仅在「启动阶段」显示红屏 —— Vue 挂载成功后由
        // main.ts 调 window.__cpBootDone() 摘除监听，运行期错误交回
        // 控制台/应用内提示（运行期任何资源/脚本错误都弹整屏红屏是不可接受的）
        function onBootError(e) {
            var box = document.getElementById('boot-err');
            if (box) {
                box.style.display = 'block';
                var msg = box.querySelector('.boot-err-msg');
                if (msg) msg.textContent = (e.message || '未知错误') + (e.error ? '\n' + (e.error.stack || '') : '');
            }
        }
        function onBootRejection(e) {
            var box = document.getElementById('boot-err');
            if (box) {
                box.style.display = 'block';
                var msg = box.querySelector('.boot-err-msg');
                if (msg) msg.textContent = 'Promise 未捕获: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
            }
        }
        window.addEventListener('error', onBootError);
        window.addEventListener('unhandledrejection', onBootRejection);
        window.__cpBootDone = function () {
            window.removeEventListener('error', onBootError);
            window.removeEventListener('unhandledrejection', onBootRejection);
            delete window.__cpBootDone;
        };
    </script>
    <style>
        #boot-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f3f3f3;color:#616161;font-family:"Segoe UI","Microsoft YaHei",sans-serif;z-index:50}
        html[data-theme="dark"] #boot-loading{background:#1a1a1e;color:#a1a1ab}
        /* 启动画面：应用图标 + 品牌色呼吸光晕（加载的「活着」感），
           下方一条滑动进度槽取代朴素的旋转圈 */
        .boot-logo{width:56px;height:56px;border-radius:14px;animation:bpulse 1.6s ease-in-out infinite;box-shadow:0 4px 18px rgba(0,103,184,.35)}
        @keyframes bpulse{0%,100%{transform:scale(1);box-shadow:0 4px 18px rgba(0,103,184,.35)}50%{transform:scale(1.05);box-shadow:0 6px 28px rgba(0,103,184,.55)}}
        .boot-bar{width:120px;height:3px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden}
        html[data-theme="dark"] .boot-bar{background:rgba(255,255,255,.10)}
        .boot-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#0067b8;animation:bslide 1.1s ease-in-out infinite}
        @keyframes bslide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
        #boot-err{display:none;position:fixed;inset:0;padding:24px;background:#fff;color:#c62828;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;overflow:auto;z-index:100}
        .boot-err-title{font-weight:bold;margin-bottom:8px;color:#c62828;font-size:15px;font-family:"Segoe UI",sans-serif}
    </style>
  <script type="module" crossorigin src="/assets/index-W1Ax4vQk.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-4vjUqLXD.css">
</head>
<body>
<div id="app"></div>
<div id="boot-loading">
    <img class="boot-logo" src="/brand.png" alt=""/>
    <div class="boot-bar"><i></i></div>
    <div>CloudPrism 加载中…</div>
</div>
<div id="boot-err">
    <div class="boot-err-title">⚠ CloudPrism 启动失败</div>
    <pre class="boot-err-msg"></pre>
</div>
</body>
</html>
