<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <title>CloudPrism</title>
    <script>
        // 首屏主题：HTML 解析完成前应用缓存主题，避免浅色闪白/深色闪黑。
        // 取值口径与 frontend/src/lib/theme.ts 镜像（KEY: cp-theme，
        // 合法值 light|dark|auto，其余回退浅色 —— 浅色无需写属性）。
        (function () {
            try {
                var t = localStorage.getItem('cp-theme');
                if (t === 'light' || t === 'dark' || t === 'auto') {
                    document.documentElement.dataset.theme = t;
                }
            } catch (e) { /* localStorage 不可用（隐私模式）时保持默认浅色 */ }
        })();
        // JS 错误兜底：Vue 挂载失败时显示错误而非空白页
        window.addEventListener('error', function (e) {
            var box = document.getElementById('boot-err');
            if (box) {
                box.style.display = 'block';
                var msg = box.querySelector('.boot-err-msg');
                if (msg) msg.textContent = (e.message || '未知错误') + (e.error ? '\n' + (e.error.stack || '') : '');
            }
        });
        window.addEventListener('unhandledrejection', function (e) {
            var box = document.getElementById('boot-err');
            if (box) {
                box.style.display = 'block';
                var msg = box.querySelector('.boot-err-msg');
                if (msg) msg.textContent = 'Promise 未捕获: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
            }
        });
    </script>
    <style>
        #boot-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f3f3f3;color:#616161;font-family:"Segoe UI","Microsoft YaHei",sans-serif;z-index:50}
        .boot-spin{width:32px;height:32px;border:3px solid #ddd;border-top-color:#0067b8;border-radius:50%;animation:bspin 1s linear infinite}
        @keyframes bspin{to{transform:rotate(360deg)}}
        #boot-err{display:none;position:fixed;inset:0;padding:24px;background:#fff;color:#c62828;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;overflow:auto;z-index:100}
        .boot-err-title{font-weight:bold;margin-bottom:8px;color:#c62828;font-size:15px;font-family:"Segoe UI",sans-serif}
    </style>
  <script type="module" crossorigin src="/assets/index-BG2lf3jn.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-qrqqhffw.css">
</head>
<body>
<div id="app"></div>
<div id="boot-loading">
    <div class="boot-spin"></div>
    <div>CloudPrism 加载中…</div>
</div>
<div id="boot-err">
    <div class="boot-err-title">⚠ CloudPrism 启动失败</div>
    <pre class="boot-err-msg"></pre>
</div>
</body>
</html>
